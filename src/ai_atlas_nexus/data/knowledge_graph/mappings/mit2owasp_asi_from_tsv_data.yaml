  # Domain 4: Malicious actors & misuse
  # ===================================================================

  # 4.1 Disinformation, surveillance, and influence at scale
  #   -> ASI01 Agent Goal Hijack: hijacked agents used for disinformation campaigns
  - id: mit-ai-risk-subdomain-4.1
    related_mappings:
      - asi01-agent-goal-hijack
    type: Risk
  - id: asi01-agent-goal-hijack
    related_mappings:
      - mit-ai-risk-subdomain-4.1
    type: Risk
  #   -> ASI09 Human-Agent Trust Exploitation: exploiting trust for influence operations
  - id: mit-ai-risk-subdomain-4.1
    related_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-4.1
    type: Risk

  # 4.2 Cyberattacks, weapon development or use, and mass harm
  #   -> ASI05 Unexpected Code Execution: agents generating malicious code for cyberattacks
  - id: mit-ai-risk-subdomain-4.2
    related_mappings:
      - asi05-unexpected-code-execution
    type: Risk
  - id: asi05-unexpected-code-execution
    related_mappings:
      - mit-ai-risk-subdomain-4.2
    type: Risk
  #   -> ASI02 Tool Misuse: misusing agent tools for cyber-offense or weapon development
  - id: mit-ai-risk-subdomain-4.2
    related_mappings:
      - asi02-tool-misuse-and-exploitation
    type: Risk
  - id: asi02-tool-misuse-and-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-4.2
    type: Risk
  #   -> ASI10 Rogue Agents: rogue agents conducting unauthorized harmful operations
  - id: mit-ai-risk-subdomain-4.2
    related_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    related_mappings:
      - mit-ai-risk-subdomain-4.2
    type: Risk

  # 4.3 Fraud, scams, and targeted manipulation
  #   -> ASI09 Human-Agent Trust Exploitation: trust exploitation enables fraud and scams
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk
  #   -> ASI01 Agent Goal Hijack: hijacked agents redirected toward fraudulent objectives
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - asi01-agent-goal-hijack
    type: Risk
  - id: asi01-agent-goal-hijack
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk
  #   -> ASI03 Identity & Privilege Abuse: identity abuse enables impersonation and fraud
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - asi03-identity-and-privilege-abuse
    type: Risk
  - id: asi03-identity-and-privilege-abuse
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk

