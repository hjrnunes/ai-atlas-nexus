  - id: mit-ai-risk-subdomain-5.1
    close_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    close_mappings:
      - mit-ai-risk-subdomain-5.1
    type: Risk

