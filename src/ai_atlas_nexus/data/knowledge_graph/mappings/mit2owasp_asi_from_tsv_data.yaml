  - id: mit-ai-risk-subdomain-7.4
    related_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    related_mappings:
      - mit-ai-risk-subdomain-7.4
    type: Risk

  # 7.5 AI welfare and rights
  # (Outside OWASP ASI's security scope — skip)

  # 7.6 Multi-agent risks
  #   -> ASI07 Insecure Inter-Agent Communication: close match — multi-agent communication risks
  - id: mit-ai-risk-subdomain-7.6
    close_mappings:
      - asi07-insecure-inter-agent-communication
    type: Risk
  - id: asi07-insecure-inter-agent-communication
    close_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk
  #   -> ASI08 Cascading Failures: multi-agent cascading failure propagation
  - id: mit-ai-risk-subdomain-7.6
    close_mappings:
      - asi08-cascading-failures
    type: Risk
  - id: asi08-cascading-failures
    close_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk
  #   -> ASI10 Rogue Agents: collusion and emergent behavior in multi-agent systems
  - id: mit-ai-risk-subdomain-7.6
    related_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    related_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk
  #   -> ASI04 Agentic Supply Chain: multi-agent systems have complex supply chains
  - id: mit-ai-risk-subdomain-7.6
    related_mappings:
      - asi04-agentic-supply-chain-vulnerabilities
    type: Risk
  - id: asi04-agentic-supply-chain-vulnerabilities
    related_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk

