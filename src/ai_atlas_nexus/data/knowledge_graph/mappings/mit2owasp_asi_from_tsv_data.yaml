  - id: mit-ai-risk-subdomain-5.2
    related_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-5.2
    type: Risk
  #   -> ASI10 Rogue Agents: agents acting autonomously beyond human control
  - id: mit-ai-risk-subdomain-5.2
    related_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    related_mappings:
      - mit-ai-risk-subdomain-5.2
    type: Risk

  # ===================================================================
  # Domain 6: Socioeconomic & Environmental
  # (Mostly outside OWASP ASI's security scope — skip 6.1-6.6)
  # ===================================================================

  # ===================================================================
  # Domain 7: AI system safety, failures, & limitations
  # ===================================================================

  # 7.1 AI pursuing its own goals in conflict with human goals or values
  #   -> ASI01 Agent Goal Hijack: close match — misaligned goals in agentic systems
  - id: mit-ai-risk-subdomain-7.1
    close_mappings:
      - asi01-agent-goal-hijack
    type: Risk
  - id: asi01-agent-goal-hijack
    close_mappings:
      - mit-ai-risk-subdomain-7.1
    type: Risk
  #   -> ASI10 Rogue Agents: agents deviating from intended goals
  - id: mit-ai-risk-subdomain-7.1
    close_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    close_mappings:
      - mit-ai-risk-subdomain-7.1
    type: Risk

  # 7.2 AI possessing dangerous capabilities
  #   -> ASI02 Tool Misuse: dangerous capabilities exercised through tool misuse
  - id: mit-ai-risk-subdomain-7.2
    related_mappings:
      - asi02-tool-misuse-and-exploitation
    type: Risk
  - id: asi02-tool-misuse-and-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-7.2
    type: Risk
  #   -> ASI05 Unexpected Code Execution: dangerous code generation and execution capabilities
  - id: mit-ai-risk-subdomain-7.2
    related_mappings:
      - asi05-unexpected-code-execution
    type: Risk
  - id: asi05-unexpected-code-execution
    related_mappings:
      - mit-ai-risk-subdomain-7.2
    type: Risk
  #   -> ASI10 Rogue Agents: dangerous capabilities in rogue agents
  - id: mit-ai-risk-subdomain-7.2
    related_mappings:
      - asi10-rogue-agents
    type: Risk
  - id: asi10-rogue-agents
    related_mappings:
      - mit-ai-risk-subdomain-7.2
    type: Risk

  # 7.3 Lack of capability or robustness
  #   -> ASI08 Cascading Failures: lack of robustness leads to cascading failures
  - id: mit-ai-risk-subdomain-7.3
    related_mappings:
      - asi08-cascading-failures
    type: Risk
  - id: asi08-cascading-failures
    related_mappings:
      - mit-ai-risk-subdomain-7.3
    type: Risk

  # 7.4 Lack of transparency or interpretability
