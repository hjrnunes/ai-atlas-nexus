  - id: mit-ai-risk-subdomain-3.2
    related_mappings:
      - asi08-cascading-failures
    type: Risk
  - id: asi08-cascading-failures
    related_mappings:
      - mit-ai-risk-subdomain-3.2
    type: Risk

