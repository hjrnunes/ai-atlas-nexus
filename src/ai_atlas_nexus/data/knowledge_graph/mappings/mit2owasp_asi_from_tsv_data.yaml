entries:
  # ===================================================================
  # Domain 1: Discrimination & Toxicity
  # ===================================================================

  # 1.2 Exposure to toxic content
  #   -> ASI01 Agent Goal Hijack: hijacked agents can be redirected to produce toxic content
  - id: mit-ai-risk-subdomain-1.2
    related_mappings:
      - asi01-agent-goal-hijack
    type: Risk
  - id: asi01-agent-goal-hijack
    related_mappings:
      - mit-ai-risk-subdomain-1.2
    type: Risk

  # ===================================================================
  # Domain 2: Privacy & Security
  # ===================================================================

  # 2.1 Compromise of privacy by obtaining, leaking or correctly inferring sensitive information
  #   -> ASI03 Identity & Privilege Abuse: privilege escalation enables data exfiltration
  - id: mit-ai-risk-subdomain-2.1
    related_mappings:
      - asi03-identity-and-privilege-abuse
    type: Risk
  - id: asi03-identity-and-privilege-abuse
    related_mappings:
      - mit-ai-risk-subdomain-2.1
    type: Risk
  #   -> ASI06 Memory & Context Poisoning: corrupted memory can leak sensitive data
  - id: mit-ai-risk-subdomain-2.1
    related_mappings:
      - asi06-memory-and-context-poisoning
    type: Risk
  - id: asi06-memory-and-context-poisoning
    related_mappings:
      - mit-ai-risk-subdomain-2.1
    type: Risk
  #   -> ASI02 Tool Misuse: tools can be misused to exfiltrate private data
  - id: mit-ai-risk-subdomain-2.1
    related_mappings:
      - asi02-tool-misuse-and-exploitation
    type: Risk
  - id: asi02-tool-misuse-and-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-2.1
    type: Risk

  # 2.2 AI system security vulnerabilities and attacks
  #   -> ASI01 Agent Goal Hijack: goal hijacking is a key agentic attack vector
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - asi01-agent-goal-hijack
    type: Risk
  - id: asi01-agent-goal-hijack
    broad_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> ASI04 Agentic Supply Chain Vulnerabilities: supply chain is a class of security vulnerability
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - asi04-agentic-supply-chain-vulnerabilities
    type: Risk
  - id: asi04-agentic-supply-chain-vulnerabilities
    broad_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> ASI05 Unexpected Code Execution: RCE is a critical security vulnerability
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - asi05-unexpected-code-execution
    type: Risk
  - id: asi05-unexpected-code-execution
    broad_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> ASI07 Insecure Inter-Agent Communication: communication weaknesses are security vulnerabilities
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - asi07-insecure-inter-agent-communication
    type: Risk
  - id: asi07-insecure-inter-agent-communication
    broad_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> ASI03 Identity & Privilege Abuse: privilege abuse is a security attack
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - asi03-identity-and-privilege-abuse
    type: Risk
  - id: asi03-identity-and-privilege-abuse
    broad_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk

  # ===================================================================
  # Domain 3: Misinformation
  # ===================================================================

  # 3.1 False or misleading information
  #   -> ASI09 Human-Agent Trust Exploitation: agents produce false information that humans trust
  - id: mit-ai-risk-subdomain-3.1
    related_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-3.1
    type: Risk
  #   -> ASI06 Memory & Context Poisoning: poisoned memory leads to false outputs
  - id: mit-ai-risk-subdomain-3.1
    related_mappings:
      - asi06-memory-and-context-poisoning
    type: Risk
  - id: asi06-memory-and-context-poisoning
    related_mappings:
      - mit-ai-risk-subdomain-3.1
    type: Risk

  # 3.2 Pollution of information ecosystem and loss of consensus reality
  #   -> ASI09 Human-Agent Trust Exploitation: trust in agents amplifies misinformation spread
  - id: mit-ai-risk-subdomain-3.2
    related_mappings:
      - asi09-human-agent-trust-exploitation
    type: Risk
  - id: asi09-human-agent-trust-exploitation
    related_mappings:
      - mit-ai-risk-subdomain-3.2
    type: Risk
