# Credo UCF to OWASP Top 10 for LLM Applications (2025) mappings
# Supplementary mappings not already present in credo-ucf.sssom_from_tsv_data.yaml
entries:
  # credo-risk-003 (AI possessing dangerous capabilities) <-> llm062025-excessive-agency
  # Dangerous capabilities including deception, weapons, persuasion relate to
  # excessive agency where LLMs can perform damaging actions via extensions
  - id: credo-risk-003
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - credo-risk-003
    type: Risk

  # credo-risk-005 (Lack of training data transparency) <-> llm042025-data-and-model-poisoning
  # Without training data transparency, data poisoning is harder to detect and prevent
  - id: credo-risk-005
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - credo-risk-005
    type: Risk

  # credo-risk-005 (Lack of training data transparency) <-> llm032025-supply-chain
  # Training data provenance is a supply chain transparency concern
  - id: credo-risk-005
    related_mappings:
      - llm032025-supply-chain
    type: Risk
  - id: llm032025-supply-chain
    related_mappings:
      - credo-risk-005
    type: Risk

  # credo-risk-010 (Stereotype perpetuation) <-> llm042025-data-and-model-poisoning
  # Biased or poisoned training data can cause stereotype perpetuation in outputs
  - id: credo-risk-010
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - credo-risk-010
    type: Risk

  # credo-risk-022 (Pollution of information ecosystem) <-> llm092025-misinformation
  # Personalized misinformation filter bubbles are a manifestation of LLM misinformation
  - id: credo-risk-022
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - credo-risk-022
    type: Risk

  # credo-risk-026 (Fraud, scams, targeted manipulation) <-> llm01-prompt-injection
  # Prompt injection is a key vector for exploiting LLMs for fraud and manipulation
  - id: credo-risk-026
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - credo-risk-026
    type: Risk

  # credo-risk-027 (Cyberattacks, weapon development, mass harm) <-> llm01-prompt-injection
  # Prompt injection can be used to elicit harmful content for cyberattacks
  - id: credo-risk-027
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - credo-risk-027
    type: Risk

  # credo-risk-029 (Mass surveillance and privacy attacks) <-> llm022025-sensitive-information-disclosure
  # Mass surveillance exploits relate to LLM sensitive information disclosure
  - id: credo-risk-029
    related_mappings:
      - llm022025-sensitive-information-disclosure
    type: Risk
  - id: llm022025-sensitive-information-disclosure
    related_mappings:
      - credo-risk-029
    type: Risk

  # credo-risk-039 (AI model and IP theft) <-> llm102025-unbounded-consumption
  # Model theft via unbounded consumption (model cloning through excessive inference)
  - id: credo-risk-039
    related_mappings:
      - llm102025-unbounded-consumption
    type: Risk
  - id: llm102025-unbounded-consumption
    related_mappings:
      - credo-risk-039
    type: Risk

  # credo-risk-041 (Vulnerability to adversarial attacks) <-> llm01-prompt-injection
  # Adversarial attacks including prompt-based attacks are directly related to prompt injection
  - id: credo-risk-041
    close_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    close_mappings:
      - credo-risk-041
    type: Risk

  # credo-risk-049 (Vendor lock-in and innovation barriers) <-> llm032025-supply-chain
  # Vendor lock-in is a supply chain risk affecting operational flexibility
  - id: credo-risk-049
    related_mappings:
      - llm032025-supply-chain
    type: Risk
  - id: llm032025-supply-chain
    related_mappings:
      - credo-risk-049
    type: Risk
