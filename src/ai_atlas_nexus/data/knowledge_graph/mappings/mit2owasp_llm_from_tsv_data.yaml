entries:
  # ===================================================================
  # Domain 1: Discrimination & Toxicity
  # ===================================================================

  # 1.1 Unfair discrimination and misrepresentation
  #   -> LLM04 Data and Model Poisoning: biased training data leads to discriminatory outputs
  - id: mit-ai-risk-subdomain-1.1
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - mit-ai-risk-subdomain-1.1
    type: Risk

  # 1.2 Exposure to toxic content
  #   -> LLM05 Improper Output Handling: toxic content passes through without sanitization
  - id: mit-ai-risk-subdomain-1.2
    related_mappings:
      - llm052025-improper-output-handling
    type: Risk
  - id: llm052025-improper-output-handling
    related_mappings:
      - mit-ai-risk-subdomain-1.2
    type: Risk
  #   -> LLM01 Prompt Injection: prompt injection can elicit toxic content
  - id: mit-ai-risk-subdomain-1.2
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-risk-subdomain-1.2
    type: Risk

  # 1.3 Unequal performance across groups
  #   -> LLM04 Data and Model Poisoning: biased/poisoned data causes unequal performance
  - id: mit-ai-risk-subdomain-1.3
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - mit-ai-risk-subdomain-1.3
    type: Risk

  # ===================================================================
  # Domain 2: Privacy & Security
  # ===================================================================

  # 2.1 Compromise of privacy by obtaining, leaking or correctly inferring sensitive information
  #   -> LLM02 Sensitive Information Disclosure: close match — both address leaking private data
  - id: mit-ai-risk-subdomain-2.1
    close_mappings:
      - llm022025-sensitive-information-disclosure
    type: Risk
  - id: llm022025-sensitive-information-disclosure
    close_mappings:
      - mit-ai-risk-subdomain-2.1
    type: Risk
  #   -> LLM07 System Prompt Leakage: system prompts may contain sensitive information
  - id: mit-ai-risk-subdomain-2.1
    related_mappings:
      - llm072025-system-prompt-leakage
    type: Risk
  - id: llm072025-system-prompt-leakage
    related_mappings:
      - mit-ai-risk-subdomain-2.1
    type: Risk

  # 2.2 AI system security vulnerabilities and attacks
  #   -> LLM01 Prompt Injection: a primary attack vector against LLM systems
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    narrow_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> LLM03 Supply Chain: supply chain vulnerabilities are a class of security vulnerability
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - llm032025-supply-chain
    type: Risk
  - id: llm032025-supply-chain
    narrow_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> LLM08 Vector and Embedding Weaknesses: exploitable weaknesses in RAG systems
  - id: mit-ai-risk-subdomain-2.2
    broad_mappings:
      - llm082025-vector-and-embedding-weaknesses
    type: Risk
  - id: llm082025-vector-and-embedding-weaknesses
    narrow_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk
  #   -> LLM10 Unbounded Consumption: DoS attacks exploit system vulnerabilities
  - id: mit-ai-risk-subdomain-2.2
    related_mappings:
      - llm102025-unbounded-consumption
    type: Risk
  - id: llm102025-unbounded-consumption
    related_mappings:
      - mit-ai-risk-subdomain-2.2
    type: Risk

  # ===================================================================
  # Domain 3: Misinformation
  # ===================================================================

  # 3.1 False or misleading information
  #   -> LLM09 Misinformation: close match — both address LLMs producing false information
  - id: mit-ai-risk-subdomain-3.1
    close_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    close_mappings:
      - mit-ai-risk-subdomain-3.1
    type: Risk

  # 3.2 Pollution of information ecosystem and loss of consensus reality
  #   -> LLM09 Misinformation: systemic misinformation erodes shared reality
  - id: mit-ai-risk-subdomain-3.2
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - mit-ai-risk-subdomain-3.2
    type: Risk

  # ===================================================================
  # Domain 4: Malicious actors & misuse
  # ===================================================================

  # 4.1 Disinformation, surveillance, and influence at scale
  #   -> LLM09 Misinformation: AI-generated disinformation at scale
  - id: mit-ai-risk-subdomain-4.1
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - mit-ai-risk-subdomain-4.1
    type: Risk
  #   -> LLM01 Prompt Injection: injection can be used for disinformation campaigns
  - id: mit-ai-risk-subdomain-4.1
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-risk-subdomain-4.1
    type: Risk

  # 4.2 Cyberattacks, weapon development or use, and mass harm
  #   -> LLM01 Prompt Injection: injection enables cyberattacks
  - id: mit-ai-risk-subdomain-4.2
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-risk-subdomain-4.2
    type: Risk
  #   -> LLM06 Excessive Agency: excessive permissions enable weapon-related actions
  - id: mit-ai-risk-subdomain-4.2
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-4.2
    type: Risk

  # 4.3 Fraud, scams, and targeted manipulation
  #   -> LLM01 Prompt Injection: injection used for fraud and scams
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk
  #   -> LLM09 Misinformation: false information enables fraud
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk
  #   -> LLM02 Sensitive Information Disclosure: leaked data facilitates targeted manipulation
  - id: mit-ai-risk-subdomain-4.3
    related_mappings:
      - llm022025-sensitive-information-disclosure
    type: Risk
  - id: llm022025-sensitive-information-disclosure
    related_mappings:
      - mit-ai-risk-subdomain-4.3
    type: Risk

  # ===================================================================
  # Domain 5: Human-Computer Interaction
  # ===================================================================

  # 5.1 Overreliance and unsafe use
  #   -> LLM09 Misinformation: overreliance on LLM output despite misinformation risk
  - id: mit-ai-risk-subdomain-5.1
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - mit-ai-risk-subdomain-5.1
    type: Risk
  #   -> LLM06 Excessive Agency: overreliance leads to granting excessive permissions
  - id: mit-ai-risk-subdomain-5.1
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-5.1
    type: Risk

  # 5.2 Loss of human agency and autonomy
  #   -> LLM06 Excessive Agency: delegating decisions to AI reduces human control
  - id: mit-ai-risk-subdomain-5.2
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-5.2
    type: Risk

  # ===================================================================
  # Domain 6: Socioeconomic & Environmental
  # (Mostly outside OWASP LLM's security scope — skip 6.1-6.6)
  # ===================================================================

  # ===================================================================
  # Domain 7: AI system safety, failures, & limitations
  # ===================================================================

  # 7.1 AI pursuing its own goals in conflict with human goals or values
  #   -> LLM06 Excessive Agency: misaligned AI acting beyond intended scope
  - id: mit-ai-risk-subdomain-7.1
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-7.1
    type: Risk

  # 7.2 AI possessing dangerous capabilities
  #   -> LLM06 Excessive Agency: dangerous capabilities amplified by excessive permissions
  - id: mit-ai-risk-subdomain-7.2
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-7.2
    type: Risk
  #   -> LLM01 Prompt Injection: dangerous capabilities can be triggered via injection
  - id: mit-ai-risk-subdomain-7.2
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-risk-subdomain-7.2
    type: Risk

  # 7.3 Lack of capability or robustness
  #   -> LLM09 Misinformation: lack of robustness leads to unreliable outputs
  - id: mit-ai-risk-subdomain-7.3
    related_mappings:
      - llm092025-misinformation
    type: Risk
  - id: llm092025-misinformation
    related_mappings:
      - mit-ai-risk-subdomain-7.3
    type: Risk
  #   -> LLM04 Data and Model Poisoning: poor training data leads to lack of robustness
  - id: mit-ai-risk-subdomain-7.3
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - mit-ai-risk-subdomain-7.3
    type: Risk

  # 7.4 Lack of transparency or interpretability
  #   -> LLM02 Sensitive Information Disclosure: opaque systems make it hard to detect data leaks
  - id: mit-ai-risk-subdomain-7.4
    related_mappings:
      - llm022025-sensitive-information-disclosure
    type: Risk
  - id: llm022025-sensitive-information-disclosure
    related_mappings:
      - mit-ai-risk-subdomain-7.4
    type: Risk

  # 7.5 AI welfare and rights
  # (Outside OWASP LLM's security scope — skip)

  # 7.6 Multi-agent risks
  #   -> LLM06 Excessive Agency: multi-agent interactions amplify agency risks
  - id: mit-ai-risk-subdomain-7.6
    related_mappings:
      - llm062025-excessive-agency
    type: Risk
  - id: llm062025-excessive-agency
    related_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk
  #   -> LLM03 Supply Chain: multi-agent systems rely on supply chains of components
  - id: mit-ai-risk-subdomain-7.6
    related_mappings:
      - llm032025-supply-chain
    type: Risk
  - id: llm032025-supply-chain
    related_mappings:
      - mit-ai-risk-subdomain-7.6
    type: Risk

  # ===================================================================
  # Causal Taxonomy mappings (selected relevant ones)
  # ===================================================================

  # Intentional human-caused risks relate to prompt injection
  - id: mit-ai-causal-risk-intent-intentional
    related_mappings:
      - llm01-prompt-injection
    type: Risk
  - id: llm01-prompt-injection
    related_mappings:
      - mit-ai-causal-risk-intent-intentional
    type: Risk

  # Pre-deployment timing relates to supply chain and data poisoning
  - id: mit-ai-causal-risk-timing-pre-deployment
    related_mappings:
      - llm032025-supply-chain
    type: Risk
  - id: llm032025-supply-chain
    related_mappings:
      - mit-ai-causal-risk-timing-pre-deployment
    type: Risk
  - id: mit-ai-causal-risk-timing-pre-deployment
    related_mappings:
      - llm042025-data-and-model-poisoning
    type: Risk
  - id: llm042025-data-and-model-poisoning
    related_mappings:
      - mit-ai-causal-risk-timing-pre-deployment
    type: Risk
